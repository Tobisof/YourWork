<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards – Nauka Słówek</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  background: #000;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 16px 14px;
}

/* ── Upload ── */
#uploadSection {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 20px;
}
#uploadSection p { color: #555; font-size: 15px; }
#fileInput { display: none; }
.btn-upload {
  display: inline-block;
  background: #0d0d2b;
  color: #7899ff;
  border: 1px solid #334499;
  padding: 16px 36px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  min-height: 56px;
}

/* ── App wrapper ── */
#app {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 640px;
  gap: 14px;
}

/* ── Settings block ── */
.settings {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.setting-row {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}

/* Segmented mode control */
.seg-group {
  display: flex;
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 4px;
  gap: 4px;
}
.seg-btn {
  background: transparent;
  border: none;
  color: #555;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
  min-height: 44px;
}
.seg-btn.active { background: #1e1e1e; color: #fff; }

/* Shuffle toggle */
.toggle-btn {
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  color: #555;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 18px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 44px;
}
.toggle-btn.active {
  background: #0d1a40;
  border-color: #2244aa;
  color: #7899ff;
}

/* Count buttons */
.setting-label {
  font-size: 12px;
  color: #444;
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.count-btn {
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  color: #555;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  min-width: 48px;
  min-height: 44px;
}
.count-btn.active {
  background: #0d2a1a;
  border-color: #1e7040;
  color: #5deba0;
}

/* ── Stats ── */
.stats {
  font-size: 13px;
  color: #555;
  text-align: center;
  line-height: 1.6;
}
.stats b { color: #bbb; }

/* ── Card ── */
.card {
  background: #0e0e0e;
  border: 1px solid #1e1e1e;
  border-radius: 20px;
  padding: clamp(32px, 8vw, 60px) clamp(20px, 6vw, 48px);
  width: 100%;
  min-height: clamp(240px, 42vw, 340px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(12px, 3vw, 22px);
  cursor: pointer;
  user-select: none;
  transition: box-shadow 0.2s, transform 0.1s;
  -webkit-user-select: none;
}
.card:active { transform: scale(0.985); }
.card.revealed { cursor: default; }

.word-front-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #2a2a2a;
}
.word-front {
  font-size: clamp(24px, 7vw, 44px);
  font-weight: 700;
  text-align: center;
  line-height: 1.2;
}
.divider {
  width: 48px;
  height: 2px;
  background: #222;
  border-radius: 1px;
  display: none;
}
.word-back {
  font-size: clamp(18px, 5vw, 30px);
  font-weight: 600;
  text-align: center;
  display: none;
  line-height: 1.3;
}
.word-back.lang-pl { color: #f0c040; }
.word-back.lang-en { color: #fff; }

.example {
  font-size: clamp(13px, 3.2vw, 15px);
  color: #666;
  font-style: italic;
  line-height: 1.7;
  text-align: center;
  max-width: 100%;
  display: none;
}
.hint {
  font-size: 13px;
  color: #2e2e2e;
  margin-top: 4px;
}

/* ── Progress bar ── */
.progress-wrap { width: 100%; }
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #444;
  margin-bottom: 6px;
}
.progress-label span { color: #666; }
.progress-track {
  height: 5px;
  background: #141414;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #1a7a42, #2ecc71);
  border-radius: 3px;
  transition: width 0.4s ease;
}

/* ── Button row ── */
.btn-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.btn {
  border: none;
  border-radius: 14px;
  font-size: clamp(14px, 4vw, 17px);
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
}
.btn:active { transform: scale(0.95); filter: brightness(0.9); }

.btn-nav {
  background: #111;
  color: #555;
  border: 1px solid #222;
  font-size: 24px;
  width: 60px;
  flex-shrink: 0;
}
.btn-nav:hover { color: #888; }

.btn-good {
  background: #0c2e1a;
  color: #5deba0;
  border: 1px solid #1a6b3c;
  flex: 1;
  gap: 6px;
}
.btn-good:hover { filter: brightness(1.2); }

.btn-bad {
  background: #2e0c0c;
  color: #eb5d5d;
  border: 1px solid #6b1a1a;
  flex: 1;
  gap: 6px;
}
.btn-bad:hover { filter: brightness(1.2); }

#actionBtns {
  display: none;
  flex: 1;
  gap: 10px;
}

/* ── Mastered screen ── */
#masteredScreen {
  display: none;
  text-align: center;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 24px;
}
#masteredScreen h2 { font-size: clamp(22px, 6vw, 32px); }
#masteredScreen p { color: #555; font-size: 15px; line-height: 1.6; }
.btn-reset {
  background: #111;
  color: #666;
  border: 1px solid #222;
  padding: 0 36px;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  min-height: 56px;
  transition: filter 0.15s;
}
.btn-reset:hover { filter: brightness(1.4); }

/* ── Mobile tweaks ── */
@media (max-width: 420px) {
  body { gap: 12px; padding: 12px 10px; }
  .seg-btn { padding: 10px 13px; font-size: 12px; }
  .toggle-btn { padding: 10px 14px; font-size: 12px; }
  .count-btn { padding: 10px 11px; font-size: 12px; min-width: 42px; }
}
</style>
</head>
<body>

<!-- Upload fallback -->
<div id="uploadSection">
  <p>Nie znaleziono words.csv – wybierz plik ręcznie:</p>
  <label class="btn-upload" for="fileInput">Wybierz plik CSV</label>
  <input type="file" id="fileInput" accept=".csv">
</div>

<!-- Main app -->
<div id="app">

  <!-- Settings -->
  <div class="settings">
    <div class="setting-row">
      <div class="seg-group">
        <button class="seg-btn" id="modeEnPl" onclick="setMode('en-pl')">ENG → PL</button>
        <button class="seg-btn" id="modePlEn" onclick="setMode('pl-en')">PL → ENG</button>
      </div>
      <button class="toggle-btn" id="shuffleBtn" onclick="toggleShuffle()">⇄ Losowo</button>
    </div>
    <div class="setting-row">
      <span class="setting-label">UCZ SIĘ:</span>
      <button class="count-btn" data-count="5"  onclick="setCount(5)">5</button>
      <button class="count-btn" data-count="10" onclick="setCount(10)">10</button>
      <button class="count-btn" data-count="20" onclick="setCount(20)">20</button>
      <button class="count-btn" data-count="50" onclick="setCount(50)">50</button>
      <button class="count-btn" data-count="0"  onclick="setCount(0)">Wszystkie</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    Karta&nbsp;<b id="statCurrent">1</b>&nbsp;/&nbsp;<b id="statTotal">0</b>
    &nbsp;·&nbsp;
    Opanowane:&nbsp;<b id="statMastered">0</b>&nbsp;/&nbsp;<b id="statAll">0</b>
  </div>

  <!-- Card -->
  <div class="card" id="card" onclick="revealCard()">
    <div class="word-front-label" id="frontLabel">ANGIELSKI</div>
    <div class="word-front" id="wordFront"></div>
    <div class="divider"   id="divider"></div>
    <div class="word-back" id="wordBack"></div>
    <div class="example"   id="wordExample"></div>
    <div class="hint"      id="hint">kliknij, aby zobaczyć tłumaczenie</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-label">
      <span>Postęp słówka</span>
      <span><span id="counterVal">0</span>&nbsp;/&nbsp;50 poprawnych</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-nav" onclick="navigate(-1)">←</button>
    <div id="actionBtns">
      <button class="btn btn-bad"  onclick="markBad()">✗&nbsp;Nie znam</button>
      <button class="btn btn-good" onclick="markGood()">✓&nbsp;Znam!</button>
    </div>
    <button class="btn btn-nav" onclick="navigate(1)">→</button>
  </div>

</div>

<!-- All mastered -->
<div id="masteredScreen">
  <h2>Wszystkie słówka opanowane!</h2>
  <p>Brawo!<br>Każde słówko zostało poprawnie odgadnięte 50 razy.</p>
  <button class="btn-reset" onclick="resetAll()">Zacznij od nowa</button>
</div>

<script>
let allWords     = [];
let activeWords  = [];
let sessionWords = [];
let currentIdx   = 0;
let revealed     = false;
let mode       = localStorage.getItem('mode')       || 'en-pl';
let shuffle    = localStorage.getItem('shuffle')    === 'true';
let studyCount = parseInt(localStorage.getItem('studyCount') || '0');

/* ── CSV parser ── */
function parseCSVLine(line) {
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  const start = lines[0].toLowerCase().includes('word_en') ? 1 : 0;
  allWords = lines.slice(start).map((line, i) => {
    const p  = parseCSVLine(line);
    const id = 'w' + i + '_' + (p[0] || '').replace(/\s+/g, '_').toLowerCase();
    const saved = localStorage.getItem(id);
    return {
      id,
      en:      p[0] || '',
      pl:      p[1] || '',
      example: p[2] || '',
      counter: saved !== null ? parseInt(saved, 10) : (parseInt(p[3], 10) || 0)
    };
  }).filter(w => w.en);

  refreshActive();
  buildSession();
  applySettings();
  render();
}

function refreshActive() {
  activeWords = allWords.filter(w => w.counter < 50);
}

function buildSession() {
  let pool = [...activeWords];
  if (shuffle) {
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  const n = studyCount > 0 ? Math.min(studyCount, pool.length) : pool.length;
  sessionWords = pool.slice(0, n);
  currentIdx = 0;
}

function save(word) {
  localStorage.setItem(word.id, word.counter);
}

/* ── Settings handlers ── */
function setMode(m) {
  mode = m;
  localStorage.setItem('mode', m);
  applySettings();
  render();
}

function toggleShuffle() {
  shuffle = !shuffle;
  localStorage.setItem('shuffle', shuffle);
  applySettings();
  buildSession();
  render();
}

function setCount(n) {
  studyCount = n;
  localStorage.setItem('studyCount', n);
  applySettings();
  buildSession();
  render();
}

function applySettings() {
  document.getElementById('modeEnPl').classList.toggle('active', mode === 'en-pl');
  document.getElementById('modePlEn').classList.toggle('active', mode === 'pl-en');

  const back = document.getElementById('wordBack');
  if (back) back.className = 'word-back ' + (mode === 'en-pl' ? 'lang-pl' : 'lang-en');

  const label = document.getElementById('frontLabel');
  if (label) label.textContent = mode === 'en-pl' ? 'ANGIELSKI' : 'POLSKI';

  document.getElementById('shuffleBtn').classList.toggle('active', shuffle);

  document.querySelectorAll('.count-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.count) === studyCount);
  });
}

/* ── Render ── */
function render() {
  const app            = document.getElementById('app');
  const masteredScreen = document.getElementById('masteredScreen');

  if (activeWords.length === 0) {
    app.style.display            = 'none';
    masteredScreen.style.display = 'flex';
    return;
  }

  if (sessionWords.length === 0) buildSession();

  app.style.display            = 'flex';
  masteredScreen.style.display = 'none';

  if (currentIdx >= sessionWords.length) currentIdx = sessionWords.length - 1;
  if (currentIdx < 0) currentIdx = 0;

  const w      = sessionWords[currentIdx];
  const isEnPl = mode === 'en-pl';

  document.getElementById('wordFront').textContent   = isEnPl ? w.en : w.pl;
  document.getElementById('wordBack').textContent    = isEnPl ? w.pl : w.en;
  document.getElementById('wordExample').textContent = w.example;

  const mastered = allWords.filter(w => w.counter >= 50).length;
  document.getElementById('statCurrent').textContent  = currentIdx + 1;
  document.getElementById('statTotal').textContent    = sessionWords.length;
  document.getElementById('statMastered').textContent = mastered;
  document.getElementById('statAll').textContent      = allWords.length;

  const pct = Math.min(100, (w.counter / 50) * 100);
  document.getElementById('counterVal').textContent   = w.counter;
  document.getElementById('progressFill').style.width = pct + '%';

  setRevealed(false);
}

function setRevealed(state) {
  revealed = state;
  ['wordBack', 'wordExample', 'divider'].forEach(id => {
    document.getElementById(id).style.display = state ? 'block' : 'none';
  });
  document.getElementById('hint').style.display       = state ? 'none'  : 'block';
  document.getElementById('actionBtns').style.display = state ? 'flex'  : 'none';
  document.getElementById('card').classList.toggle('revealed', state);
}

function revealCard() {
  if (!revealed) setRevealed(true);
}

/* ── Navigation ── */
function navigate(dir) {
  currentIdx = (currentIdx + dir + sessionWords.length) % sessionWords.length;
  render();
}

function markGood() {
  const w = sessionWords[currentIdx];
  w.counter++;
  save(w);

  if (w.counter >= 50) {
    refreshActive();
    sessionWords = sessionWords.filter(sw => sw.counter < 50);
    if (sessionWords.length === 0) { render(); return; }
    if (currentIdx >= sessionWords.length) currentIdx = sessionWords.length - 1;
    render();
  } else {
    navigate(1);
  }
}

function markBad() {
  navigate(1);
}

function resetAll() {
  allWords.forEach(w => { w.counter = 0; localStorage.removeItem(w.id); });
  refreshActive();
  buildSession();
  currentIdx = 0;
  render();
}

/* ── Init ── */
async function init() {
  try {
    const resp = await fetch('words.csv');
    if (!resp.ok) throw new Error();
    parseCSV(await resp.text());
    document.getElementById('uploadSection').style.display = 'none';
  } catch {
    document.getElementById('uploadSection').style.display = 'flex';
  }
}

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    document.getElementById('uploadSection').style.display = 'none';
    parseCSV(evt.target.result);
  };
  reader.readAsText(file);
});

applySettings();
init();
</script>
</body>
</html>
