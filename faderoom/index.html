<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fade Room — Daniel Chwołka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:      #faf9f7;
    --bg2:     #f2f0ec;
    --fg:      #0f0e0c;
    --fg-dim:  #8a867e;
    --accent:  #0f0e0c;
    --accent2: #c8a96e;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans:  'DM Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-weight: 300;
    overflow-x: hidden;
  }

  /* ── NOISE GRAIN ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.04;
    pointer-events: none;
    z-index: 100;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px clamp(24px, 6vw, 80px);
    mix-blend-mode: multiply;
  }

  nav .nav-logo {
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
  }

  nav .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  nav .nav-links a {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg-dim);
    text-decoration: none;
    transition: color 0.2s;
  }

  nav .nav-links a:hover { color: var(--fg); }

  /* ── HERO ── */
  .hero {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 100px 24px 60px;
    overflow: hidden;
  }

  /* Subtle bg clipper — light ink on white */
  .hero-bg-clipper {
    position: absolute;
    right: clamp(-60px, -2vw, 0px);
    top: 50%;
    transform: translateY(-50%);
    width: min(54vw, 540px);
    opacity: 0.11;
    pointer-events: none;
  }

  .hero-bg-scissors {
    position: absolute;
    left: clamp(-40px, -1vw, 10px);
    bottom: 10%;
    width: min(24vw, 220px);
    opacity: 0.09;
    pointer-events: none;
    transform: rotate(20deg);
  }

  /* Thin top border line */
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: var(--fg);
    opacity: 0.08;
  }

  .hero-content {
    text-align: center;
    position: relative;
    z-index: 1;
    max-width: 900px;
    width: 100%;
  }

  .hero-eyebrow {
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 32px;
    animation: fadeUp 0.9s 0.1s cubic-bezier(0.16,1,0.3,1) both;
  }

  .hero-title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(80px, 14vw, 190px);
    letter-spacing: 0.06em;
    line-height: 0.88;
    color: var(--fg);
    animation: fadeUp 1s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  .hero-title .room {
    display: block;
    font-style: italic;
    font-size: 0.54em;
    letter-spacing: 0.14em;
    color: var(--fg);
    opacity: 0.35;
  }

  .hero-rule {
    display: flex;
    align-items: center;
    gap: 24px;
    margin: 40px auto;
    max-width: 320px;
    animation: fadeUp 0.8s 0.35s cubic-bezier(0.16,1,0.3,1) both;
  }

  .hero-rule::before,
  .hero-rule::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--fg);
    opacity: 0.15;
  }

  .hero-rule-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--fg);
    opacity: 0.25;
  }

  .hero-name {
    font-family: var(--serif);
    font-size: clamp(15px, 1.8vw, 20px);
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--fg-dim);
    animation: fadeUp 0.8s 0.45s cubic-bezier(0.16,1,0.3,1) both;
  }

  .hero-cta {
    margin-top: 52px;
    animation: fadeUp 0.8s 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  .btn-primary {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--bg);
    background: var(--fg);
    padding: 16px 44px;
    text-decoration: none;
    transition: background 0.25s, transform 0.2s;
  }

  .btn-primary:hover {
    background: #2a2822;
    transform: translateY(-2px);
  }

  .scroll-hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: fadeIn 1s 1s ease both;
  }

  .scroll-hint span {
    font-size: 8px;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .scroll-line {
    width: 1px;
    height: 36px;
    background: linear-gradient(to bottom, var(--fg-dim), transparent);
    animation: scrollPulse 2.2s 2s ease infinite;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    font-size: 9px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--fg-dim);
    margin-bottom: 48px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    max-width: 60px;
    height: 1px;
    background: var(--fg);
    opacity: 0.15;
  }

  /* ── GALLERY ── */
  .gallery-section {
    padding: clamp(80px, 10vw, 140px) clamp(24px, 7vw, 100px);
    max-width: 1400px;
    margin: 0 auto;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 14px;
  }

  /* First image: tall, spans 2 rows */
  .gallery-item:nth-child(1) {
    grid-row: 1 / 3;
    position: relative;
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    background: var(--bg2);
    cursor: pointer;
  }

  .gallery-item::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(15,14,12,0);
    transition: background 0.4s;
  }

  .gallery-item:hover::after {
    background: rgba(15,14,12,0.06);
  }

  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s cubic-bezier(0.16,1,0.3,1);
  }

  .gallery-item:hover img { transform: scale(1.04); }

  /* Placeholder */
  .photo-ph {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-linear-gradient(
      -45deg,
      var(--bg2),
      var(--bg2) 5px,
      #eae7e1 5px,
      #eae7e1 10px
    );
  }

  .gallery-item:nth-child(1) .photo-ph {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  .gallery-item:not(:nth-child(1)) .photo-ph {
    aspect-ratio: 4/3;
  }

  .gallery-item:nth-child(1) {
    min-height: 500px;
  }

  .gallery-item:not(:nth-child(1)) {
    aspect-ratio: 4/3;
  }

  .photo-ph-inner {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  .photo-ph svg { opacity: 0.2; width: 28px; height: 28px; }

  .photo-ph p {
    font-family: monospace;
    font-size: 9px;
    color: var(--fg-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.6;
  }

  /* ── CONTACT ── */
  .contact-section {
    border-top: 1px solid rgba(15,14,12,0.08);
    padding: clamp(80px, 10vw, 140px) clamp(24px, 7vw, 100px);
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(48px, 8vw, 120px);
    align-items: start;
  }

  .contact-heading {
    font-family: var(--serif);
    font-size: clamp(44px, 6vw, 86px);
    font-weight: 300;
    line-height: 1;
    color: var(--fg);
  }

  .contact-heading em {
    font-style: italic;
    opacity: 0.35;
  }

  .contact-links {
    display: flex;
    flex-direction: column;
    padding-top: 4px;
  }

  .contact-item {
    padding: 28px 0;
    border-bottom: 1px solid rgba(15,14,12,0.08);
    display: grid;
    grid-template-columns: 110px 1fr;
    align-items: center;
    gap: 16px;
  }

  .contact-item:first-child { border-top: 1px solid rgba(15,14,12,0.08); }

  .ci-label {
    font-size: 9px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .ci-value a {
    font-family: var(--serif);
    font-size: clamp(18px, 2.2vw, 28px);
    font-weight: 400;
    color: var(--fg);
    text-decoration: none;
    letter-spacing: 0.04em;
    transition: opacity 0.2s;
  }

  .ci-value a:hover { opacity: 0.5; }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid rgba(15,14,12,0.08);
    padding: 28px clamp(24px, 7vw, 100px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes scrollPulse {
    0%,100% { opacity: 0.4; transform: scaleY(1); }
    50%      { opacity: 0.8; transform: scaleY(0.65); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s cubic-bezier(0.16,1,0.3,1),
                transform 0.9s cubic-bezier(0.16,1,0.3,1);
  }
  .reveal.visible { opacity: 1; transform: none; }
  .reveal-d1 { transition-delay: 0.1s; }
  .reveal-d2 { transition-delay: 0.2s; }
  .reveal-d3 { transition-delay: 0.3s; }
  .reveal-d4 { transition-delay: 0.4s; }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    .gallery-grid {
      grid-template-columns: 1fr 1fr;
    }
    .gallery-item:nth-child(1) {
      grid-column: 1 / 3;
      grid-row: 1;
    }
    .gallery-item:nth-child(1) .photo-ph {
      position: relative;
      aspect-ratio: 16/9;
      height: auto;
    }
    nav .nav-links { display: none; }
  }

  @media (max-width: 640px) {
    .gallery-grid {
      grid-template-columns: 1fr;
    }
    .gallery-item:nth-child(1) {
      grid-column: 1;
    }
    .gallery-item:nth-child(1) .photo-ph {
      aspect-ratio: 4/3;
    }
    .contact-section {
      grid-template-columns: 1fr;
      gap: 40px;
    }
    .contact-item {
      grid-template-columns: 90px 1fr;
    }
    footer {
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }
  }

  /* ── TWEAKS PANEL ── */
  #tweaks-panel {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 9999;
    background: #faf9f7;
    border: 1px solid rgba(15,14,12,0.12);
    padding: 20px 22px;
    width: 230px;
    font-family: var(--sans);
    color: var(--fg);
    font-size: 12px;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>

<!-- HERO -->
<section class="hero">

  <!-- BG clipper -->
  <svg class="hero-bg-clipper" viewBox="0 0 400 620" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="120" y="60" width="160" height="310" rx="80" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="148" y1="160" x2="252" y2="160" stroke="#0f0e0c" stroke-width="1.5" opacity="0.5"/>
    <line x1="148" y1="190" x2="252" y2="190" stroke="#0f0e0c" stroke-width="1.5" opacity="0.5"/>
    <line x1="148" y1="220" x2="252" y2="220" stroke="#0f0e0c" stroke-width="1.5" opacity="0.5"/>

    <line x1="148" y1="393" x2="148" y2="434" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="163" y1="393" x2="163" y2="444" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="178" y1="393" x2="178" y2="434" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="193" y1="393" x2="193" y2="444" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="208" y1="393" x2="208" y2="434" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="223" y1="393" x2="223" y2="444" stroke="#0f0e0c" stroke-width="2.5"/>
    <line x1="238" y1="393" x2="238" y2="434" stroke="#0f0e0c" stroke-width="2.5"/>

    <path d="M200 370 C200 470 265 470 265 550 C265 590 228 600 205 600" stroke="#0f0e0c" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
  </svg>

  <!-- BG scissors left — classic barber scissors, angled -->  
  <svg class="hero-bg-scissors" viewBox="0 0 200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- BLADE 1: top-left to pivot -->
    <path d="M100 240 L30 60" stroke="#0f0e0c" stroke-width="4" stroke-linecap="round"/>
    <!-- Blade 1 body (thin triangle shape) -->
    <path d="M100 240 L30 60 L38 56 L106 238 Z" fill="#0f0e0c" opacity="0.12"/>
    <!-- Tip 1 -->
    <path d="M30 60 L26 52" stroke="#0f0e0c" stroke-width="3" stroke-linecap="round"/>

    <!-- BLADE 2: top-right to pivot -->

    <path d="M100 240 L170 60 L162 56 L94 238 Z" fill="#0f0e0c" opacity="0.12"/>

    <!-- SHANK 1: pivot down-left to ring -->
    <path d="M100 240 L72 380" stroke="#0f0e0c" stroke-width="4" stroke-linecap="round"/>
    <!-- FINGER RING 1 -->
    <circle cx="60" cy="412" r="28" stroke="#0f0e0c" stroke-width="3"/>
    <line x1="72" y1="380" x2="70" y2="386" stroke="#0f0e0c" stroke-width="3" stroke-linecap="round"/>

    <!-- SHANK 2: pivot down-right to ring -->

    <line x1="128" y1="380" x2="130" y2="386" stroke="#0f0e0c" stroke-width="3" stroke-linecap="round"/>
  </svg>

  <div class="hero-content">

  </div>

  <div class="scroll-hint">

</section>

<!-- TWEAKS PANEL -->
<div id="tweaks-panel">
  <div style="font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:#8a867e;margin-bottom:16px">Tweaks</div>

  <label style="display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8a867e;margin-bottom:6px">Akcent</label>
  <select id="tw-accent" style="width:100%;background:#fff;border:1px solid rgba(15,14,12,.12);color:#0f0e0c;padding:7px 8px;font-size:11px;margin-bottom:16px;font-family:inherit">

    <option value="warm">Ciepły brąz</option>
    <option value="slate">Zimny grafit</option>
  </select>

  <label style="display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8a867e;margin-bottom:6px">Rozmiar tytułu</label>
  <input id="tw-size" type="range" min="7" max="17" step="0.5" value="14" style="width:100%;accent-color:#0f0e0c">
  <div id="tw-size-val" style="font-size:10px;color:#8a867e;text-align:right;margin-top:4px">14vw</div>
</div>

<script>
  // Reveal on scroll
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

  // Tweaks
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "warm",
    "heroSize": 17
  }/*EDITMODE-END*/;

  const accentMap = {
    black: { fg: '#0f0e0c', fgd: '#8a867e', bg: '#faf9f7', bg2: '#eae7e1' },
    warm:  { fg: '#2a1f10', fgd: '#8a7a65', bg: '#faf8f4', bg2: '#f0ebe0' },
    slate: { fg: '#10131a', fgd: '#7a8090', bg: '#f6f7fa', bg2: '#eceef4' },
  };

  function applyTweaks(t) {
    const a = accentMap[t.accent] || accentMap.black;
    const r = document.documentElement.style;
    r.setProperty('--fg',     a.fg);
    r.setProperty('--fg-dim', a.fgd);
    r.setProperty('--bg',     a.bg);
    r.setProperty('--bg2',    a.bg2);
    r.setProperty('--accent', a.fg);
    document.querySelector('.hero-title').style.fontSize = `clamp(72px, ${t.heroSize}vw, 190px)`;
  }

  applyTweaks(TWEAK_DEFAULTS);

  const panel = document.getElementById('tweaks-panel');
  const selAccent = document.getElementById('tw-accent');
  const sliderSize = document.getElementById('tw-size');
  const sizeVal = document.getElementById('tw-size-val');

  selAccent.value = TWEAK_DEFAULTS.accent;
  sliderSize.value = TWEAK_DEFAULTS.heroSize;

  function onTweak() {
    const t = { accent: selAccent.value, heroSize: parseFloat(sliderSize.value) };
    sizeVal.textContent = t.heroSize + 'vw';
    applyTweaks(t);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: t }, '*');
  }

  selAccent.addEventListener('change', onTweak);
  sliderSize.addEventListener('input', onTweak);

  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode')   panel.style.display = 'block';
    if (e.data?.type === '__deactivate_edit_mode') panel.style.display = 'none';
  });

  window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>
</body>
</html>
