<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zamów stronę - Tobiasz Lubowski</title>
<style>
  :root {
    --bg: #fbe7a0;
    --ink: #14141a;
    --accent: #e6a431;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .card {
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.8rem;
    opacity: 0.65;
    margin: 0 0 0.8rem;
    font-family: var(--mono);
  }
  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    margin: 0 0 1.2rem;
    line-height: 1.15;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.6;
    opacity: 0.85;
    margin: 0 0 1.6rem;
  }
  .mail-btn {
    display: inline-block;
    padding: 0.9rem 2rem;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: var(--mono);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .mail-btn:hover { opacity: 0.85; transform: translateY(-2px); }
  .mail-plain {
    display: block;
    margin-top: 1.2rem;
    font-size: 0.9rem;
    opacity: 0.6;
    color: inherit;
  }
  .back {
    display: inline-block;
    margin-top: 2.5rem;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    color: inherit;
    opacity: 0.55;
    text-decoration: none;
  }
  .back:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Kontakt</p>
  <h1>Zamów swoją stronę</h1>
  <p>
    Tworzę proste strony typu one-page - na wizytówkę, ofertę albo prezentację
    projektu. Napisz do mnie, a wspólnie ustalimy szczegóły.
  </p>
  <a class="mail-btn" href="mailto:lubowskitobiasz.kontakt@gmail.com?subject=Zam%C3%B3wienie%20strony%20WWW">
    Napisz do mnie
  </a>
  <a class="mail-plain" href="mailto:lubowskitobiasz.kontakt@gmail.com">lubowskitobiasz.kontakt@gmail.com</a>
  <br>
  <a class="back" href="../index.html">← Wróć na stronę główną</a>
</div>

</body>
</html>
